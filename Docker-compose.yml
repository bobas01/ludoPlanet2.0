services:
  db:
    image: mariadb:11
    ports:
      - "3307:3306"
    volumes:
      - ./database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ludoplanet
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    command: --wait_timeout=28800 --interactive_timeout=28800 --max_allowed_packet=64M
    networks:
      - app-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - app-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "2525:1025"
      - "8025:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
