services:
  db:
    image: mariadb:10.11
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ludoplanet
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    command: --wait_timeout=28800 --interactive_timeout=28800 --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mariadb-admin", "--protocol=tcp", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NO_CACHE=1
    ports:
      - "3503:4173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NO_CACHE=1
    ports:
      - "3502:8000"
    volumes:
      - backend_var:/app/var
      - ./.env:/app/.env:ro  # Read-only
    environment:
      - DATABASE_URL=mysql://root:root@db:3306/ludoplanet?serverVersion=mariadb-10.11
      - MAILER_DSN=smtp://mailpit:1025?verify_peer=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "2525:1025"
      - "8025:8025"
    networks:
      - app-network

volumes:
  db_data:
  backend_var:

networks:
  app-network:
    driver: bridge
