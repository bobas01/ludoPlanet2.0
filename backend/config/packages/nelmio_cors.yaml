# Configuration CORS via Nelmio (remplace CorsEventSubscriber).
# Origines : paramètre cors_origins (services.yaml). En prod, définir CORS_ALLOWED_ORIGINS (csv).
nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: '%cors_origins%'
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        allow_credentials: true
        max_age: 86400
    paths:
        '^/':
            allow_origin: '%cors_origins%'
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            allow_credentials: true
            max_age: 86400
