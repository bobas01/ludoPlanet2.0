# Configuration CORS via Nelmio. Liste explicite pour éviter tout souci de paramètre en prod.
nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            - "http://localhost:5173"
            - "http://127.0.0.1:5173"
            - "http://localhost:4173"
            - "http://127.0.0.1:4173"
            - "http://localhost:3503"
            - "http://127.0.0.1:3503"
            - "^https?://72\\.60\\.189\\.212(:[0-9]+)?$"
        allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        allow_headers: ["Content-Type", "Authorization"]
        allow_credentials: true
        max_age: 86400
    paths:
        "^/":
            origin_regex: true
            allow_origin:
                - "http://localhost:5173"
                - "http://127.0.0.1:5173"
                - "http://localhost:4173"
                - "http://127.0.0.1:4173"
                - "http://localhost:3503"
                - "http://127.0.0.1:3503"
                - "^https?://72\\.60\\.189\\.212(:[0-9]+)?$"
            allow_headers: ["Content-Type", "Authorization"]
            allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allow_credentials: true
            max_age: 86400
